<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="待办清单">
<meta name="mobile-web-app-capable" content="yes">
<title>待办清单</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --sub:#8e8e93;
    --line:#e5e5ea; --accent:#007aff; --danger:#ff3b30;
    --done:#34c759; --shadow:0 1px 3px rgba(0,0,0,.06), 0 8px 20px rgba(0,0,0,.04);
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --sub:#8e8e93;
      --line:#2c2c2e; --accent:#0a84ff; --danger:#ff453a; --done:#30d158;
      --shadow:0 1px 3px rgba(0,0,0,.4); }
    meta[name="theme-color"]{ color:#000; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
  }
  .app{ max-width:560px; margin:0 auto; padding:calc(var(--safe-top) + 18px) 16px calc(var(--safe-bottom) + 24px); }

  /* header */
  header{ padding:8px 4px 14px; }
  h1{ margin:0; font-size:30px; font-weight:800; letter-spacing:-.5px; }
  .date{ margin-top:4px; font-size:14px; color:var(--sub); font-weight:500; }
  .stats{ display:flex; gap:8px; margin-top:12px; font-size:13px; color:var(--sub); }
  .stats span{ background:var(--card); padding:4px 10px; border-radius:999px; box-shadow:var(--shadow); }

  /* input bar */
  .inputbar{
    display:flex; gap:8px; align-items:center; position:sticky; top:0; z-index:10;
    padding:8px 0 12px; background:var(--bg);
  }
  .inputbar input{
    flex:1; height:48px; padding:0 16px; font-size:16px; color:var(--text);
    background:var(--card); border:1px solid transparent; border-radius:14px;
    outline:none; box-shadow:var(--shadow); transition:border-color .15s;
  }
  .inputbar input::placeholder{ color:var(--sub); }
  .inputbar input:focus{ border-color:var(--accent); }
  .addbtn{
    width:48px; height:48px; flex:0 0 48px; border:none; border-radius:14px;
    background:var(--accent); color:#fff; font-size:26px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .1s, opacity .15s;
  }
  .addbtn:active{ transform:scale(.94); }
  .addbtn:disabled{ opacity:.4; }

  /* list */
  ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    animation:pop .18s ease-out;
  }
  @keyframes pop{ from{ transform:scale(.97); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .check{
    width:24px; height:24px; flex:0 0 24px; border-radius:50%;
    border:2px solid var(--line); background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .check:active{ transform:scale(.9); }
  .check svg{ width:14px; height:14px; opacity:0; transition:opacity .15s; }

  .text{
    flex:1; font-size:16px; line-height:1.4; word-break:break-word;
    transition:color .15s, text-decoration-color .15s;
  }
  .time{ display:block; font-size:12px; color:var(--sub); margin-top:2px; }

  li.done .check{ background:var(--done); border-color:var(--done); }
  li.done .check svg{ opacity:1; }
  li.done .text{ color:var(--sub); text-decoration:line-through; text-decoration-color:var(--sub); }

  .del{
    width:32px; height:32px; flex:0 0 32px; border:none; background:transparent;
    color:var(--sub); font-size:20px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:color .15s, background .15s;
  }
  .del:active{ background:rgba(255,59,48,.12); color:var(--danger); }

  .empty{ text-align:center; padding:64px 20px; color:var(--sub); }
  .empty .ico{ font-size:52px; margin-bottom:12px; opacity:.55; }
  .empty p{ margin:6px 0; font-size:15px; line-height:1.6; }

  /* footer actions */
  .footer{ display:flex; gap:10px; justify-content:center; margin-top:20px; }
  .ghost{
    border:1px solid var(--line); background:var(--card); color:var(--sub);
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .ghost:active{ color:var(--danger); border-color:var(--danger); }
  .hint{ text-align:center; font-size:12px; color:var(--sub); margin-top:18px; opacity:.7; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>待办清单</h1>
    <div class="date" id="date"></div>
    <div class="stats">
      <span id="statTotal">0 项</span>
      <span id="statLeft">待完成 0</span>
    </div>
  </header>

  <div class="inputbar">
    <input id="input" type="text" placeholder="做点什么…" autocomplete="off" enterkeyhint="done" maxlength="200">
    <button class="addbtn" id="addBtn" aria-label="添加">+</button>
  </div>

  <ul id="list"></ul>

  <div class="empty" id="empty">
    <div class="ico">📝</div>
    <p>还没有任务</p>
    <p>在上面输入框写下第一件事吧</p>
  </div>

  <div class="footer" id="footer" hidden>
    <button class="ghost" id="clearDone">清除已完成</button>
  </div>
  <p class="hint">数据保存在本机，关闭后不会丢失</p>
</div>

<script>
(function(){
  "use strict";
  var KEY = "todo.items.v1";
  var listEl  = document.getElementById("list");
  var emptyEl = document.getElementById("empty");
  var inputEl = document.getElementById("input");
  var addBtn  = document.getElementById("addBtn");
  var footer  = document.getElementById("footer");
  var items   = [];

  var WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      items = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(items)) items = [];
    }catch(e){ items = []; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(items)); }
    catch(e){ console.warn("保存失败", e); }
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function fmtTime(ts){
    var d = new Date(ts), n = new Date();
    var pad = function(x){ return x < 10 ? "0" + x : "" + x; };
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    var sameDay = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    if(sameDay) return "今天 " + hm;
    return (d.getMonth()+1) + "月" + d.getDate() + "日 " + hm;
  }

  function renderTopDate(){
    var n = new Date();
    document.getElementById("date").textContent =
      n.getFullYear() + "年" + (n.getMonth()+1) + "月" + n.getDate() + "日 " + WEEK[n.getDay()];
  }

  function render(){
    listEl.innerHTML = "";
    if(items.length === 0){
      emptyEl.hidden = false;
      footer.hidden = true;
    }else{
      emptyEl.hidden = true;
      items.forEach(function(it){
        var li = document.createElement("li");
        li.className = it.done ? "done" : "";
        li.dataset.id = it.id;

        var btn = document.createElement("button");
        btn.className = "check";
        btn.setAttribute("aria-label", it.done ? "标记为未完成" : "标记为完成");
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>';

        var span = document.createElement("span");
        span.className = "text";
        span.textContent = it.text;
        var t = document.createElement("span");
        t.className = "time";
        t.textContent = fmtTime(it.createdAt);
        span.appendChild(t);

        var del = document.createElement("button");
        del.className = "del";
        del.setAttribute("aria-label", "删除");
        del.textContent = "✕";

        li.appendChild(btn);
        li.appendChild(span);
        li.appendChild(del);
        listEl.appendChild(li);
      });
      var hasDone = items.some(function(x){ return x.done; });
      footer.hidden = !hasDone;
    }
    var left = items.filter(function(x){ return !x.done; }).length;
    document.getElementById("statTotal").textContent = items.length + " 项";
    document.getElementById("statLeft").textContent = "待完成 " + left;
    addBtn.disabled = inputEl.value.trim().length === 0;
  }

  function add(){
    var text = inputEl.value.trim();
    if(!text) return;
    items.unshift({ id: uid(), text: text, done: false, createdAt: Date.now() });
    inputEl.value = "";
    save(); render();
    inputEl.focus();
  }

  function toggle(id){
    var it = items.find(function(x){ return x.id === id; });
    if(it){ it.done = !it.done; save(); render(); }
  }

  function remove(id){
    items = items.filter(function(x){ return x.id !== id; });
    save(); render();
  }

  // events
  addBtn.addEventListener("click", add);
  inputEl.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); add(); }
  });
  inputEl.addEventListener("input", function(){
    addBtn.disabled = inputEl.value.trim().length === 0;
  });

  listEl.addEventListener("click", function(e){
    var li = e.target.closest("li");
    if(!li) return;
    var id = li.dataset.id;
    if(e.target.closest(".check")) toggle(id);
    else if(e.target.closest(".del")) remove(id);
  });

  document.getElementById("clearDone").addEventListener("click", function(){
    var n = items.filter(function(x){ return x.done; }).length;
    if(n === 0) return;
    if(!confirm("清除 " + n + " 项已完成的任务？")) return;
    items = items.filter(function(x){ return !x.done; });
    save(); render();
  });

  // service worker
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  load(); renderTopDate(); render();
})();
</script>
</body>
</html>
